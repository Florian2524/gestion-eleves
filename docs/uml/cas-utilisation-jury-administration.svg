<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 2240 1584"><title>Gestion des élèves · Administration scolaire</title><rect x="0" y="0" width="2240" height="1584" fill="white" /><defs><marker id="generalisation" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="19" markerHeight="19" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 15 8 L 1 15 Z" fill="white" stroke="#526173" stroke-width="1.5" /></marker></defs><text x="40" y="52" font-family="Arial, sans-serif" font-size="32" fill="#233247" text-anchor="start" data-text-id="text-1" font-weight="700">GESTION DES ÉLÈVES</text><text x="40" y="94" font-family="Arial, sans-serif" font-size="27" fill="#233247" text-anchor="start" data-text-id="text-2" font-weight="700">Administration scolaire</text><text x="40" y="128" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-3">Fonctions réservées au rôle ADMIN ; « gérer » regroupe les opérations proposées, sous réserve des règles métier.</text><text x="2180" y="50" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="end" data-text-id="text-4" font-weight="700">ANNEXE CDA · CAS D’UTILISATION</text><rect x="820" y="150" width="1260" height="1300" fill="white" stroke="#738296" stroke-width="1.5" /><text x="845" y="184" font-family="Arial, sans-serif" font-size="22" fill="#233247" text-anchor="start" data-text-id="text-5" font-weight="700">Application Gestion des élèves</text><path d="M 610 770 L 900 245" fill="none" stroke="#526173" stroke-width="1.6" data-edge="Admin-A01" /><path d="M 610 770 L 900 345" fill="none" stroke="#526173" stroke-width="1.6" data-edge="Admin-A02" /><path d="M 610 770 L 900 445" fill="none" stroke="#526173" stroke-width="1.6" data-edge="Admin-A03" /><path d="M 610 770 L 900 545" fill="none" stroke="#526173" stroke-width="1.6" data-edge="Admin-A04" /><path d="M 610 770 L 900 645" fill="none" stroke="#526173" stroke-width="1.6" data-edge="Admin-A05" /><path d="M 610 770 L 900 745" fill="none" stroke="#526173" stroke-width="1.6" data-edge="Admin-A06" /><path d="M 610 770 L 900 845" fill="none" stroke="#526173" stroke-width="1.6" data-edge="Admin-A07" /><path d="M 610 770 L 900 945" fill="none" stroke="#526173" stroke-width="1.6" data-edge="Admin-A08" /><path d="M 610 770 L 900 1045" fill="none" stroke="#526173" stroke-width="1.6" data-edge="Admin-A09" /><path d="M 610 770 L 900 1145" fill="none" stroke="#526173" stroke-width="1.6" data-edge="Admin-A10" /><path d="M 610 770 L 900 1245" fill="none" stroke="#526173" stroke-width="1.6" data-edge="Admin-A11" /><path d="M 610 770 L 900 1345" fill="none" stroke="#526173" stroke-width="1.6" data-edge="Admin-A12" /><circle cx="560" cy="730" r="18" fill="white" stroke="#526173" stroke-width="1.8" /><path d="M 560 748 V 805 M 510 770 H 610 M 560 805 L 522 845 M 560 805 L 598 845" fill="none" stroke="#526173" stroke-width="1.8" /><text x="560" y="880" font-family="Arial, sans-serif" font-size="24" fill="#233247" text-anchor="middle" data-text-id="Admin-label-0" data-role="Admin">Administrateur</text><text x="1690" y="185" font-family="Arial, sans-serif" font-size="22" fill="#233247" text-anchor="start" data-text-id="text-7" font-weight="700">Opérations couvertes</text><ellipse cx="1270.0" cy="245.0" rx="370.0" ry="38.0" fill="#E7F3EE" stroke="#738296" stroke-width="1.5" data-node="A01" /><text x="1270.0" y="253.5" font-family="Arial, sans-serif" font-size="25" fill="#233247" text-anchor="middle" data-case-text="A01">Gérer les dossiers élèves</text><text x="1690" y="240" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-8">Identité, coordonnées, photo.</text><text x="1690" y="265" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-9">Créer ou rattacher le profil élève.</text><ellipse cx="1270.0" cy="345.0" rx="370.0" ry="38.0" fill="#E7F3EE" stroke="#738296" stroke-width="1.5" data-node="A02" /><text x="1270.0" y="353.5" font-family="Arial, sans-serif" font-size="25" fill="#233247" text-anchor="middle" data-case-text="A02">Gérer les profils enseignants</text><text x="1690" y="340" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-10">Créer, rattacher, modifier</text><text x="1690" y="365" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-11">ou retirer le profil.</text><ellipse cx="1270.0" cy="445.0" rx="370.0" ry="38.0" fill="#E7F3EE" stroke="#738296" stroke-width="1.5" data-node="A03" /><text x="1270.0" y="453.5" font-family="Arial, sans-serif" font-size="25" fill="#233247" text-anchor="middle" data-case-text="A03">Gérer les profils responsables</text><text x="1690" y="440" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-12">Créer, rattacher, modifier</text><text x="1690" y="465" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-13">ou retirer le profil.</text><ellipse cx="1270.0" cy="545.0" rx="370.0" ry="38.0" fill="#E7EFF9" stroke="#738296" stroke-width="1.5" data-node="A04" /><text x="1270.0" y="553.5" font-family="Arial, sans-serif" font-size="25" fill="#233247" text-anchor="middle" data-case-text="A04">Administrer les comptes</text><text x="1690" y="540" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-14">Créer, modifier, activer ou désactiver,</text><text x="1690" y="565" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-15">changer rôle et mot de passe,</text><text x="1690" y="590" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-16">supprimer un compte.</text><ellipse cx="1270.0" cy="645.0" rx="370.0" ry="38.0" fill="#E7F3EE" stroke="#738296" stroke-width="1.5" data-node="A05" /><text x="1270.0" y="653.5" font-family="Arial, sans-serif" font-size="25" fill="#233247" text-anchor="middle" data-case-text="A05">Lier responsables et élèves</text><text x="1690" y="640" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-17">Consulter, ajouter ou retirer</text><text x="1690" y="665" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-18">une responsabilité légale.</text><ellipse cx="1270.0" cy="745.0" rx="370.0" ry="38.0" fill="#FFF1D9" stroke="#738296" stroke-width="1.5" data-node="A06" /><text x="1270.0" y="753.5" font-family="Arial, sans-serif" font-size="25" fill="#233247" text-anchor="middle" data-case-text="A06">Gérer les inscriptions</text><text x="1690" y="740" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-19">Dates et statut administratif.</text><text x="1690" y="765" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-20">L’inscription n’affecte pas une classe.</text><ellipse cx="1270.0" cy="845.0" rx="370.0" ry="38.0" fill="#FFF1D9" stroke="#738296" stroke-width="1.5" data-node="A07" /><text x="1270.0" y="853.5" font-family="Arial, sans-serif" font-size="25" fill="#233247" text-anchor="middle" data-case-text="A07">Affecter les élèves aux classes</text><text x="1690" y="840" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-21">Créer, modifier ou supprimer</text><text x="1690" y="865" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-22">une scolarité datée.</text><ellipse cx="1270.0" cy="945.0" rx="370.0" ry="38.0" fill="#FFF1D9" stroke="#738296" stroke-width="1.5" data-node="A08" /><text x="1270.0" y="953.5" font-family="Arial, sans-serif" font-size="25" fill="#233247" text-anchor="middle" data-case-text="A08">Organiser les classes</text><text x="1690" y="940" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-23">Nom, niveau, année scolaire,</text><text x="1690" y="965" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-24">professeur principal.</text><ellipse cx="1270.0" cy="1045.0" rx="370.0" ry="38.0" fill="#EEEAF8" stroke="#738296" stroke-width="1.5" data-node="A09" /><text x="1270.0" y="1053.5" font-family="Arial, sans-serif" font-size="25" fill="#233247" text-anchor="middle" data-case-text="A09">Gérer les matières</text><text x="1690" y="1040" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-25">Code et libellé des matières.</text><ellipse cx="1270.0" cy="1145.0" rx="370.0" ry="38.0" fill="#EEEAF8" stroke="#738296" stroke-width="1.5" data-node="A10" /><text x="1270.0" y="1153.5" font-family="Arial, sans-serif" font-size="25" fill="#233247" text-anchor="middle" data-case-text="A10">Configurer les périodes</text><text x="1690" y="1140" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-26">Dates, année, statut</text><text x="1690" y="1165" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-27">et fenêtres de saisie.</text><ellipse cx="1270.0" cy="1245.0" rx="370.0" ry="38.0" fill="#EEEAF8" stroke="#738296" stroke-width="1.5" data-node="A11" /><text x="1270.0" y="1253.5" font-family="Arial, sans-serif" font-size="25" fill="#233247" text-anchor="middle" data-case-text="A11">Définir les pondérations</text><text x="1690" y="1240" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-28">Coefficient du couple classe–matière.</text><ellipse cx="1270.0" cy="1345.0" rx="370.0" ry="38.0" fill="#EEEAF8" stroke="#738296" stroke-width="1.5" data-node="A12" /><text x="1270.0" y="1353.5" font-family="Arial, sans-serif" font-size="25" fill="#233247" text-anchor="middle" data-case-text="A12">Affecter les enseignements</text><text x="1690" y="1340" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-29">Enseignant, classe, matière,</text><text x="1690" y="1365" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-30">dates et activation.</text><text x="40" y="1504" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-31">Professeur principal : affectation d’un enseignant à une classe, sans permission supplémentaire.</text><text x="40" y="1540" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-32">Trait plein : participation · triangle vide : généralisation d’acteur</text><text x="2180" y="1540" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="end" data-text-id="text-33">A3 paysage · 2 / 3</text></svg>