ont-size="24" fill="#233247" text-anchor="middle" data-text-id="Admin-label-0" data-role="Admin">Administrateur</text><circle cx="200" cy="720" r="18" fill="white" stroke="#526173" stroke-width="1.8" /><path d="M 200 738 V 795 M 150 760 H 250 M 200 795 L 162 835 M 200 795 L 238 835" fill="none" stroke="#526173" stroke-width="1.8" /><text x="200" y="870" font-family="Arial, sans-serif" font-size="24" fill="#233247" text-anchor="middle" data-text-id="Teacher-label-0" data-role="Teacher">Enseignant</text><circle cx="200" cy="1130" r="18" fill="white" stroke="#526173" stroke-width="1.8" /><path d="M 200 1148 V 1205 M 150 1170 H 250 M 200 1205 L 162 1245 M 200 1205 L 238 1245" fill="none" stroke="#526173" stroke-width="1.8" /><text x="200" y="1280" font-family="Arial, sans-serif" font-size="24" fill="#233247" text-anchor="middle" data-text-id="Responsible-label-0" data-role="Responsible">Responsable</text><text x="200" y="1309" font-family="Arial, sans-serif" font-size="24" fill="#233247" text-anchor="middle" data-text-id="Responsible-label-1" data-role="Responsible">légal</text><circle cx="2160" cy="230" r="18" fill="white" stroke="#526173" stroke-width="1.8" /><path d="M 2160 248 V 305 M 2110 270 H 2210 M 2160 305 L 2122 345 M 2160 305 L 2198 345" fill="none" stroke="#526173" stroke-width="1.8" /><text x="2160" y="380" font-family="Arial, sans-serif" font-size="20" fill="#233247" text-anchor="middle" data-text-id="Anon-label-0" data-role="Anon">Utilisateur non</text><text x="2160" y="409" font-family="Arial, sans-serif" font-size="20" fill="#233247" text-anchor="middle" data-text-id="Anon-label-1" data-role="Anon">authentifié</text><ellipse cx="1180.0" cy="270.0" rx="280.0" ry="50.0" fill="#E7EFF9" stroke="#738296" stroke-width="1.5" data-node="C03" /><text x="1180.0" y="278.16" font-family="Arial, sans-serif" font-size="24" fill="#233247" text-anchor="middle" data-case-text="C03">Ouvrir son espace personnel</text><ellipse cx="1180.0" cy="420.0" rx="280.0" ry="50.0" fill="#E7EFF9" stroke="#738296" stroke-width="1.5" data-node="C04" /><text x="1180.0" y="428.16" font-family="Arial, sans-serif" font-size="24" fill="#233247" text-anchor="middle" data-case-text="C04">Se déconnecter</text><ellipse cx="1180.0" cy="570.0" rx="280.0" ry="50.0" fill="#E7F3EE" stroke="#738296" stroke-width="1.5" data-node="C05" /><text x="1180.0" y="578.16" font-family="Arial, sans-serif" font-size="24" fill="#233247" text-anchor="middle" data-case-text="C05">Consulter les dossiers élèves</text><ellipse cx="1180.0" cy="720.0" rx="280.0" ry="50.0" fill="#EEEAF8" stroke="#738296" stroke-width="1.5" data-node="C06" /><text x="1180.0" y="728.16" font-family="Arial, sans-serif" font-size="24" fill="#233247" text-anchor="middle" data-case-text="C06">Consulter les enseignements</text><ellipse cx="1180.0" cy="870.0" rx="280.0" ry="50.0" fill="#EEEAF8" stroke="#738296" stroke-width="1.5" data-node="C07" /><text x="1180.0" y="878.16" font-family="Arial, sans-serif" font-size="24" fill="#233247" text-anchor="middle" data-case-text="C07">Consulter les évaluations</text><ellipse cx="1180.0" cy="1020.0" rx="280.0" ry="50.0" fill="#FBEAEC" stroke="#738296" stroke-width="1.5" data-node="C08" /><text x="1180.0" y="1028.16" font-family="Arial, sans-serif" font-size="24" fill="#233247" text-anchor="middle" data-case-text="C08">Consulter les notes</text><ellipse cx="1180.0" cy="1170.0" rx="280.0" ry="50.0" fill="#FBEAEC" stroke="#738296" stroke-width="1.5" data-node="C09" /><text x="1180.0" y="1162.5600000000002" font-family="Arial, sans-serif" font-size="24" fill="#233247" text-anchor="middle" data-case-text="C09">Calculer et consulter</text><text x="1180.0" y="1193.7600000000002" font-family="Arial, sans-serif" font-size="24" fill="#233247" text-anchor="middle" data-case-text="C09">un bulletin</text><ellipse cx="1180.0" cy="1320.0" rx="280.0" ry="50.0" fill="#FBEAEC" stroke="#738296" stroke-width="1.5" data-node="C10" /><text x="1180.0" y="1328.16" font-family="Arial, sans-serif" font-size="24" fill="#233247" text-anchor="middle" data-case-text="C10">Télécharger le bulletin PDF</text><text x="1520" y="215" font-family="Arial, sans-serif" font-size="22" fill="#233247" text-anchor="start" data-text-id="text-16" font-weight="700">Accès public</text><ellipse cx="1750.0" cy="305.0" rx="230.0" ry="50.0" fill="#E7EFF9" stroke="#738296" stroke-width="1.5" data-node="C02" /><text x="1750.0" y="313.16" font-family="Arial, sans-serif" font-size="24" fill="#233247" text-anchor="middle" data-case-text="C02">Se connecter</text><ellipse cx="1750.0" cy="490.0" rx="230.0" ry="50.0" fill="#E7EFF9" stroke="#738296" stroke-width="1.5" data-node="C01" /><text x="1750.0" y="498.16" font-family="Arial, sans-serif" font-size="24" fill="#233247" text-anchor="middle" data-case-text="C01">Consulter l’accueil</text><text x="1520" y="660" font-family="Arial, sans-serif" font-size="22" fill="#233247" text-anchor="start" data-text-id="text-17" font-weight="700">Périmètres de consultation</text><text x="1520" y="705" font-family="Arial, sans-serif" font-size="22" fill="#233247" text-anchor="start" data-text-id="text-18" font-weight="700">Administrateur</text><text x="1520" y="741" font-family="Arial, sans-serif" font-size="19" fill="#233247" text-anchor="start" data-text-id="text-19">Tous les dossiers et résultats.</text><text x="1520" y="835" font-family="Arial, sans-serif" font-size="22" fill="#233247" text-anchor="start" data-text-id="text-20" font-weight="700">Enseignant</text><text x="1520" y="871" font-family="Arial, sans-serif" font-size="19" fill="#233247" text-anchor="start" data-text-id="text-21">Dossiers : classes enseignées.</text><text x="1520" y="901" font-family="Arial, sans-serif" font-size="19" fill="#233247" text-anchor="start" data-text-id="text-22">Notes et évaluations : ses enseignements.</text><text x="1520" y="995" font-family="Arial, sans-serif" font-size="22" fill="#233247" text-anchor="start" data-text-id="text-23" font-weight="700">Responsable légal</text><text x="1520" y="1031" font-family="Arial, sans-serif" font-size="19" fill="#233247" text-anchor="start" data-text-id="text-24">Élèves liés par responsabilité légale.</text><text x="1520" y="1200" font-family="Arial, sans-serif" font-size="22" fill="#233247" text-anchor="start" data-text-id="text-25" font-weight="700">Vues complémentaires</text><text x="1520" y="1240" font-family="Arial, sans-serif" font-size="20" fill="#233247" text-anchor="start" data-text-id="text-26">02 · Administration scolaire</text><text x="1520" y="1275" font-family="Arial, sans-serif" font-size="20" fill="#233247" text-anchor="start" data-text-id="text-27">03 · Évaluations et notes</text><text x="1520" y="1360" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-28">Authentification requise hors accès public.</text><text x="40" y="1504" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-29">Utilisateur authentifié est un acteur abstrait, pas un quatrième rôle de sécurité.</text><text x="40" y="1540" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-30">Trait plein : participation · triangle vide : généralisation d’acteur</text><text x="2180" y="1540" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="end" data-text-id="text-31">A3 paysage · 1 / 3</text></svg>