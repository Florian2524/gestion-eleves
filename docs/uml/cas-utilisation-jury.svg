<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 2240 1584"><title>Gestion des élèves · Vue générale · Accès et consultation</title><rect x="0" y="0" width="2240" height="1584" fill="white" /><defs><marker id="generalisation" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="19" markerHeight="19" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 15 8 L 1 15 Z" fill="white" stroke="#526173" stroke-width="1.5" /></marker></defs><text x="40" y="52" font-family="Arial, sans-serif" font-size="32" fill="#233247" text-anchor="start" data-text-id="text-1" font-weight="700">GESTION DES ÉLÈVES</text><text x="40" y="94" font-family="Arial, sans-serif" font-size="27" fill="#233247" text-anchor="start" data-text-id="text-2" font-weight="700">Vue générale · Accès et consultation</text><text x="40" y="128" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-3">Droits communs aux trois rôles ; opérations d’administration et de saisie détaillées dans les vues 2 et 3.</text><text x="2180" y="50" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="end" data-text-id="text-4" font-weight="700">ANNEXE CDA · CAS D’UTILISATION</text><rect x="820" y="150" width="1220" height="1300" fill="white" stroke="#738296" stroke-width="1.5" /><text x="845" y="184" font-family="Arial, sans-serif" font-size="22" fill="#233247" text-anchor="start" data-text-id="text-5" font-weight="700">Application Gestion des élèves</text><rect x="500" y="700" width="240" height="140" fill="#F8FAFC" stroke="#738296" stroke-width="1.5" /><path d="M 740 770 L 900 270" fill="none" stroke="#526173" stroke-width="1.6" data-edge="Auth-C03" /><path d="M 740 770 L 900 420" fill="none" stroke="#526173" stroke-width="1.6" data-edge="Auth-C04" /><path d="M 740 770 L 900 570" fill="none" stroke="#526173" stroke-width="1.6" data-edge="Auth-C05" /><path d="M 740 770 L 900 720" fill="none" stroke="#526173" stroke-width=