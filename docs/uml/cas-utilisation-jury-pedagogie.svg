<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 2240 1584"><title>Gestion des élèves · Saisie pédagogique · Évaluations et notes</title><rect x="0" y="0" width="2240" height="1584" fill="white" /><defs><marker id="generalisation" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="19" markerHeight="19" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 15 8 L 1 15 Z" fill="white" stroke="#526173" stroke-width="1.5" /></marker></defs><text x="40" y="52" font-family="Arial, sans-serif" font-size="32" fill="#233247" text-anchor="start" data-text-id="text-1" font-weight="700">GESTION DES ÉLÈVES</text><text x="40" y="94" font-family="Arial, sans-serif" font-size="27" fill="#233247" text-anchor="start" data-text-id="text-2" font-weight="700">Saisie pédagogique · Évaluations et notes</text><text x="40" y="128" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-3">Deux acteurs autorisés à écrire ; les responsabilités de chacun restent distinctes.</text><text x="2180" y="50" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="end" data-text-id="text-4" font-weight="700">ANNEXE CDA · CAS D’UTILISATION</text><rect x="600" y="150" width="1040" height="1300" fill="white" stroke="#738296" stroke-width="1.5" /><text x="625" y="184" font-family="Arial, sans-serif" font-size="22" fill="#233247" text-anchor="start" data-text-id="text-5" font-weight="700">Application Gestion des élèves</text><path d="M 370 770 L 780 495" fill="none" stroke="#526173" stroke-width="1.6" data-edge="Admin-P01" /><path d="M 1900 770 L 1480 495" fill="none" stroke="#526173" stroke-width="1.6" data-edge="Teacher-P01" /><path d="M 370 770 L 780 1095" fill="none" stroke="#526173" stroke-width="1.6" data-edge="Admin-P02" /><path d="M 1900 770 L 1480 1095" fill="none" stroke="#526173" stroke-width="1.6" data-edge="Teacher-P02" /><circle cx="320" cy="730" r="18" fill="white" stroke="#526173" stroke-width="1.8" /><path d="M 320 748 V 805 M 270 770 H 370 M 320 805 L 282 845 M 320 805 L 358 845" fill="none" stroke="#526173" stroke-width="1.8" /><text x="320" y="880" font-family="Arial, sans-serif" font-size="24" fill="#233247" text-anchor="middle" data-text-id="Admin-label-0" data-role="Admin">Administrateur</text><circle cx="1950" cy="730" r="18" fill="white" stroke="#526173" stroke-width="1.8" /><path d="M 1950 748 V 805 M 1900 770 H 2000 M 1950 805 L 1912 845 M 1950 805 L 1988 845" fill="none" stroke="#526173" stroke-width="1.8" /><text x="1950" y="880" font-family="Arial, sans-serif" font-size="24" fill="#233247" text-anchor="middle" data-text-id="Teacher-label-0" data-role="Teacher">Enseignant</text><ellipse cx="1130.0" cy="495.0" rx="350.0" ry="65.0" fill="#EEEAF8" stroke="#738296" stroke-width="1.5" data-node="P01" /><text x="1130.0" y="505.2" font-family="Arial, sans-serif" font-size="30" fill="#233247" text-anchor="middle" data-case-text="P01">Gérer les évaluations</text><ellipse cx="1130.0" cy="1095.0" rx="350.0" ry="65.0" fill="#FBEAEC" stroke="#738296" stroke-width="1.5" data-node="P02" /><text x="1130.0" y="1105.2" font-family="Arial, sans-serif" font-size="30" fill="#233247" text-anchor="middle" data-case-text="P02">Gérer les notes</text><text x="1130" y="630" font-family="Arial, sans-serif" font-size="23" fill="#233247" text-anchor="middle" data-text-id="text-8">Créer, modifier ou supprimer une évaluation.</text><text x="1130" y="670" font-family="Arial, sans-serif" font-size="21" fill="#233247" text-anchor="middle" data-text-id="text-9">Définir le barème et le coefficient d’évaluation.</text><text x="1130" y="1230" font-family="Arial, sans-serif" font-size="23" fill="#233247" text-anchor="middle" data-text-id="text-10">Saisir, corriger, commenter ou supprimer une note.</text><text x="1130" y="1270" font-family="Arial, sans-serif" font-size="21" fill="#233247" text-anchor="middle" data-text-id="text-11">Rattacher la note à une évaluation et à une scolarité.</text><text x="320" y="970" font-family="Arial, sans-serif" font-size="21" fill="#233247" text-anchor="middle" data-text-id="text-12">Toutes les évaluations</text><text x="320" y="1002" font-family="Arial, sans-serif" font-size="21" fill="#233247" text-anchor="middle" data-text-id="text-13">et toutes les notes.</text><text x="1950" y="970" font-family="Arial, sans-serif" font-size="21" fill="#233247" text-anchor="middle" data-text-id="text-14">Ses enseignements</text><text x="1950" y="1002" font-family="Arial, sans-serif" font-size="21" fill="#233247" text-anchor="middle" data-text-id="text-15">et leurs évaluations / notes.</text><text x="40" y="1504" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-16">Responsable légal : consultation uniquement (vue 1). Aucun cas de validation ou d’archivage de bulletin n’est implémenté.</text><text x="40" y="1540" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="start" data-text-id="text-17">Trait plein : participation · triangle vide : généralisation d’acteur</text><text x="2180" y="1540" font-family="Arial, sans-serif" font-size="18" fill="#233247" text-anchor="end" data-text-id="text-18">A3 paysage · 3 / 3</text></svg>