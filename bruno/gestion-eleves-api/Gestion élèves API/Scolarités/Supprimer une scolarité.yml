info:
  name: Supprimer une scolarité
  type: http
  seq: 8

http:
  method: DELETE
  url: "{{baseUrl}}/scolarites/{{idScolarite}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
