info:
  name: Consulter une scolarité
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/scolarites/{{idScolarite}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
