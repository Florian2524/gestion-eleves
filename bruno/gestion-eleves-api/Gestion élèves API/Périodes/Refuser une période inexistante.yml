info:
  name: Refuser une période inexistante
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/periodes/{{idPeriode}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.status
      operator: eq
      value: "404"
    - expression: res.body.error
      operator: eq
      value: Not Found

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
