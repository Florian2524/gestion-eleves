info:
  name: Consulter une période
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/periodes/{{idPeriode}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.idPeriode
      operator: eq
      value: "{{idPeriode}}"
    - expression: res.body.libelle
      operator: eq
      value: Trimestre 1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
