info:
  name: Refuser un élève inexistant
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/responsabilites-legales"
  body:
    type: json
    data: |-
      {
        "idResponsable": {{idResponsable}},
        "idEleve": 999999
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
