info:
  name: Créer une inscription
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/inscriptions"
  body:
    type: json
    data: |-
      {
        "idEleve": {{idEleve}},
        "dateInscription": "2026-09-01",
        "dateFin": null,
        "statut": "ACTIVE"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
