info:
  name: Refuser des dates d'inscription incohérentes
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/inscriptions"
  body:
    type: json
    data: |-
      {
        "idEleve": {{idEleve}},
        "dateInscription": "2026-09-02",
        "dateFin": "2026-09-01",
        "statut": "ACTIVE"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
