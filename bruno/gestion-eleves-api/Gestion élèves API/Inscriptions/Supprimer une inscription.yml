info:
  name: Supprimer une inscription
  type: http
  seq: 7

http:
  method: DELETE
  url: "{{baseUrl}}/inscriptions/{{idInscription}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
