info:
  name: Modifier une inscription
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/inscriptions/{{idInscription}}"
  body:
    type: json
    data: |-
      {
        "idEleve": {{idEleve}},
        "dateInscription": "2026-09-01",
        "dateFin": "2027-06-30",
        "statut": "TERMINEE"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
