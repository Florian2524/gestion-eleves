info:
  name: Modifier une évaluation
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/evaluations/{{idEvaluation}}"
  body:
    type: json
    data: |-
      {
        "idEnseignement": {{idEnseignement}},
        "idPeriode": {{idPeriode}},
        "libelle": "Contrôle de mathématiques - chapitre 2",
        "dateEvaluation": "2026-10-20",
        "typeEvaluation": "DEVOIR",
        "coefficientEvaluation": 3.00,
        "bareme": 20.00
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
