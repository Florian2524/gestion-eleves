info:
  name: Refuser une matière inexistante
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/matieres/{{idMatiere}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.status
      operator: eq
      value: "404"
    - expression: res.body.error
      operator: eq
      value: Not Found
    - expression: res.body.path
      operator: eq
      value: /matieres/2

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
