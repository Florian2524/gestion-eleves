info:
  name: Supprimer une matière
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{baseUrl}}/matieres/{{idMatiere}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
