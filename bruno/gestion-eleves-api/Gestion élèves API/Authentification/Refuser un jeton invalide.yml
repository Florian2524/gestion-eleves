info:
  name: Refuser un jeton invalide
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/matieres"
  auth: none

runtime:
  scripts:
    - type: before-request
      code: |-
        req.setHeader(
          "Authorization",
          "Bearer jeton-jwt-invalide"
        );
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
