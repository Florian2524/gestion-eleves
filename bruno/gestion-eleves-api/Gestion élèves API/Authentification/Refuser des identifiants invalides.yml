info:
  name: Refuser des identifiants invalides
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "emailConnexion": "admin.jwt@example.com",
        "motDePasse": "MotDePasseIncorrect"
      }
auth: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
