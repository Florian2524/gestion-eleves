info:
  name: Accéder avec le jeton administrateur
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/matieres"
  auth: none

runtime:
  scripts:
    - type: before-request
      code: |-
        const runtimeToken = bru.getVar("jwtToken");
        const environmentToken = bru.getEnvVar("jwtToken");
        const token = runtimeToken || environmentToken;

        if (!token) {
          throw new Error(
            "jwtToken est vide. Exécuter d'abord la connexion valide."
          );
        }


        req.setHeader(
          "Authorization",
          "Bearer " + token
        );
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
