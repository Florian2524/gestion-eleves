info:
  name: Refuser une période inexistante
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/bulletins/calcul/{{idScolarite}}/999999"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const idScolarite =
          bru.getVar("idScolarite") ||
          bru.getEnvVar("idScolarite");

        if (!idScolarite) {
          throw new Error(
            "idScolarite est vide."
          );
        }

  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.status
      operator: eq
      value: "404"
    - expression: res.body.error
      operator: eq
      value: "Not Found"
    - expression: res.body.path
      operator: eq
      value: "/bulletins/calcul/{{idScolarite}}/999999"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
