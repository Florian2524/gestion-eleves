info:
  name: Télécharger un bulletin PDF
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/bulletins/calcul/{{idScolarite}}/{{idPeriode}}/pdf"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const idScolarite =
          bru.getVar("idScolarite") ||
          bru.getEnvVar("idScolarite");

        const idPeriode =
          bru.getVar("idPeriode") ||
          bru.getEnvVar("idPeriode");

        const token =
          bru.getVar("jwtToken") ||
          bru.getEnvVar("jwtToken");

        if (!token) {
          throw new Error(
            "jwtToken est vide. Exécuter d'abord la connexion valide."
          );
        }

        if (!idScolarite) {
          throw new Error(
            "idScolarite est vide."
          );
        }

        if (!idPeriode) {
          throw new Error(
            "idPeriode est vide."
          );
        }

        console.log(
          "Téléchargement du bulletin PDF : scolarité=" +
          idScolarite +
          ", période=" +
          idPeriode
        );

  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
