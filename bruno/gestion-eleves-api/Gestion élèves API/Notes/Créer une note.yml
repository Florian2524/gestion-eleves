info:
  name: Créer une note
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/notes"
  body:
    type: json
    data: |-
      {
        "idScolarite": {{idScolarite}},
        "idEvaluation": {{idEvaluation}},
        "valeur": 15.50,
        "commentaire": "Bon travail.",
        "statutNote": "SAISIE"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
