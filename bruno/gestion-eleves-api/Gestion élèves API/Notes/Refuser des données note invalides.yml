info:
  name: Refuser des données note invalides
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/notes"
  body:
    type: json
    data: |-
      {
        "idScolarite": -1,
        "idEvaluation": 0,
        "valeur": -1,
        "commentaire": null,
        "statutNote": ""
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
