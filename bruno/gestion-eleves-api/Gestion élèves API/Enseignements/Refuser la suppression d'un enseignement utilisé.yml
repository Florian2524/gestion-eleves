info:
  name: Refuser la suppression d'un enseignement utilisé
  type: http
  seq: 9

http:
  method: DELETE
  url: "{{baseUrl}}/enseignements/{{idEnseignementUtilise}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5