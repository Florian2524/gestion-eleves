info:
  name: Supprimer un enseignement
  type: http
  seq: 10

http:
  method: DELETE
  url: "{{baseUrl}}/enseignements/{{idEnseignement}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5