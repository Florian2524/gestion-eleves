info:
  name: Refuser un compte utilisateur inexistant
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/comptes-utilisateurs/999999"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
