info:
  name: Refuser une personne inexistante
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/comptes-utilisateurs"
  body:
    type: json
    data: |-
      {
        "idPersonne": 999999,
        "emailConnexion": "personne.inexistante@example.com",
        "motDePasse": "MotDePasse123",
        "role": "ADMIN"
      }  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
