info:
  name: Supprimer un compte utilisateur
  type: http
  seq: 12

http:
  method: DELETE
  url: "{{baseUrl}}/comptes-utilisateurs/{{idUtilisateur}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
