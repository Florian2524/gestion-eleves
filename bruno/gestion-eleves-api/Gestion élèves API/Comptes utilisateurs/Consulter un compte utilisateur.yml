info:
  name: Consulter un compte utilisateur
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/comptes-utilisateurs/{{idUtilisateur}}"
  body:
    type: json
    data: |-
        auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
