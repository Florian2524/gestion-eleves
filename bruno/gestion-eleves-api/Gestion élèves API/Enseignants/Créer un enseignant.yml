info:
  name: Créer un enseignant
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/enseignants"
  body:
    type: json
    data: |-
      {
        "nom": "Martin",
        "prenom": "Sophie",
        "emailContact": "sophie.martin@example.com",
        "telephone": "0611223344",
        "adresse": "20 rue des Écoles",
        "numeroEmploye": "ENS-BRUNO-001"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5