info:
  name: Supprimer un enseignant
  type: http
  seq: 9

http:
  method: DELETE
  url: "{{baseUrl}}/enseignants/{{idEnseignant}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5