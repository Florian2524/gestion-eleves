info:
  name: Consulter un enseignant
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/enseignants/{{idEnseignant}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5