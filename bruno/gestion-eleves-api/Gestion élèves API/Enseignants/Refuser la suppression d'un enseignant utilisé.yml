info:
  name: Refuser la suppression d'un enseignant utilisé
  type: http
  seq: 8

http:
  method: DELETE
  url: "{{baseUrl}}/enseignants/{{idEnseignantUtilise}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5